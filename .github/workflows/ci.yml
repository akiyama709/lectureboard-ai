name: Core Swift CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: LectureBoardCore tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: swift --version

      - name: Lint Swift sources
        run: |
          swift format lint --recursive \
            Packages/LectureBoardCore/Sources \
            Packages/LectureBoardCore/Tests

      - name: Build and test platform-neutral core
        run: swift test --package-path Packages/LectureBoardCore
