name: macOS 26 Full CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    name: Core, native app, and publication gates
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select the verified Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show verification toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Run the complete verification gate
        run: ./scripts/prepublish-check.sh

      - name: Confirm generated-project reproducibility
        run: git diff --exit-code -- LectureBoardAI.xcodeproj

      - name: Retain the native test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-xcresult-${{ github.run_id }}
          path: DerivedData/AppTests/Logs/Test/*.xcresult
          if-no-files-found: error
          retention-days: 30
