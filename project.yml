name: LectureBoardAI
options:
  bundleIdPrefix: io.github.akiyama709
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
  projectFormat: xcode16_3
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  LectureBoardCore:
    path: Packages/LectureBoardCore

targets:
  LectureBoardAI:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: LectureBoardAI/Sources
      - path: LectureBoardAI/Resources
        buildPhase: resources
    dependencies:
      - package: LectureBoardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akiyama709.LectureBoardAI
        PRODUCT_NAME: LectureBoard AI
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LectureBoardAI/Config/Info.plist
        LECTUREBOARD_RELEASE_COMMIT: UNBOUND
        LECTUREBOARD_RELEASE_TAG: UNBOUND
        LECTUREBOARD_RELEASE_TAG_OBJECT: UNBOUND
        CODE_SIGN_ENTITLEMENTS: LectureBoardAI/Config/LectureBoardAI.entitlements
        CODE_SIGN_STYLE: Automatic

  LectureBoardAITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: LectureBoardAI/Tests
    dependencies:
      - target: LectureBoardAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akiyama709.LectureBoardAITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LectureBoard AI.app/Contents/MacOS/LectureBoard AI"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LectureBoardAI:
    build:
      targets:
        LectureBoardAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LectureBoardAITests
    archive:
      config: Release
